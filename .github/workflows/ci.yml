name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build FSharp.Graphics.slnx -c Release

      - name: Build WASM project (.NET verification)
        run: dotnet build src/FSharp.Graphics.Wasm/FSharp.Graphics.Wasm.fsproj -c Release

      - name: Interact tests (where a drag lands)
        run: dotnet run --project tests/FSharp.Graphics.InteractTests/FSharp.Graphics.InteractTests.fsproj -c Release

      - name: Icons tests (SVG path data to segments, every icon as a scene)
        run: dotnet run --project tests/FSharp.Graphics.IconsTests/FSharp.Graphics.IconsTests.fsproj -c Release

      - name: Charts tests (the pyramid against a loop, the density grid against a count, the polygons)
        run: dotnet run --project tests/FSharp.Graphics.ChartsTests/FSharp.Graphics.ChartsTests.fsproj -c Release

      - name: Canvas tests (which part of the picture a frame changed)
        run: dotnet run --project tests/FSharp.Graphics.CanvasTests/FSharp.Graphics.CanvasTests.fsproj -c Release

      - name: Math Tests
        run: dotnet run --project tests/FSharp.Math.Tests/FSharp.Math.Tests.fsproj -c Release

      - name: Unit + Property Tests
        run: dotnet run --project tests/FSharp.Graphics.Tests/FSharp.Graphics.Tests.fsproj -c Release

      - name: WASM Tests (.NET mode)
        run: dotnet run --project tests/FSharp.Graphics.WasmTests/FSharp.Graphics.WasmTests.fsproj -c Release

      # The libraries as NuGet packages (dll, XML docs, and the sources for programs compiled by fsharp-wasm).  A preview version
      # from the run number; nothing is published — a release takes the packages from here.
      - name: Pack
        run: bash build/pack.sh 0.1.0-ci.${{ github.run_number }}

      # contrast of the themes, the semantics of every widget, the size of the targets and the keyboard
      - name: Accessibility tests of the widgets
        run: dotnet run --project tests/FSharp.Graphics.WidgetTests/FSharp.Graphics.WidgetTests.fsproj -c Release

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: dist/nupkg/*.nupkg

      - name: Generate Actual PNGs
        run: dotnet run --project tests/FSharp.Graphics.GoldenTests/FSharp.Graphics.GoldenTests.fsproj -c Release -- --actual-dir .golden-actual

      - name: Compare against golden masters
        run: dotnet run --project tests/FSharp.Graphics.GoldenTests/FSharp.Graphics.GoldenTests.fsproj -c Release -- --compare --golden-dir golden/png --actual-dir .golden-actual

      - name: Upload actual images on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: .golden-actual/
